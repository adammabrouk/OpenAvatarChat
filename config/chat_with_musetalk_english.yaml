# Realtime MuseTalk talking-head avatar, English, streaming in the browser (WebRTC).
#   mic -> SenseVoice ASR (local GPU) -> Azure OpenAI LLM (API) -> Edge TTS (free, English)
#       -> MuseTalk avatar (local GPU) -> WebRTC video.  Idle-loops your video when silent; speaks on voice.
#
# This is the WORKABLE, UI-having streaming avatar (talk to it in the browser). It uses YOUR OWN
# initial video (see AvatarMusetalk.avatar_video_path + force_create_avatar below).
#
# Set your Azure key in .env:   AZURE_OPENAI_API_KEY=xxxxxxxx
default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
        output_video_fps: 25   # MUST equal AvatarMusetalk.fps
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      # ASR: SenseVoice (local GPU, multilingual incl. English)
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      # TTS: free Microsoft Edge English voice (no API key)
      Edge_TTS:
        enabled: True
        module: tts/edgetts/tts_handler_edgetts
        voice: "en-US-AriaNeural"
      # LLM: Azure OpenAI, OpenAI-compatible v1 endpoint. Fill in your resource + deployment.
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "gpt-4o-mini"                                       # <-- your Azure DEPLOYMENT name
        api_url: "https://YOUR-RESOURCE.openai.azure.com/openai/v1/"    # <-- your Azure OpenAI resource
        # api_key: reads $AZURE_OPENAI_API_KEY from .env by default
        enable_video_input: False
        history_length: 20
        system_prompt: "You are a friendly assistant. Reply in English with two or three short spoken-style sentences and natural punctuation."
      # Avatar: MuseTalk (realtime lip-sync). Idle-loops the video below; speaks when TTS audio flows.
      AvatarMusetalk:
        module: avatar/musetalk/avatar_handler_musetalk
        fps: 25                                     # must equal RtcClient.output_video_fps
        batch_size: 2
        avatar_video_path: "src/handlers/avatar/musetalk/MuseTalk/data/video/yongen.mp4"  # <-- YOUR initial video
        avatar_model_dir: "models/musetalk/avatar_model"
        force_create_avatar: true                   # run the one-time preparation on first launch; set false after
        debug: false

# English end-to-end pipeline on a single GPU (e.g. Tesla T4):
#   mic -> SenseVoice ASR (local GPU) -> LLM via Azure OpenAI API (remote)
#       -> Edge TTS (free, remote, English, NO api key) -> SoulX-FlashHead avatar (local GPU) -> WebRTC video
#
# No DASHSCOPE / Bailian key needed:
#   - LLM  -> your Azure OpenAI deployment (OpenAI-compatible v1 endpoint)
#   - TTS  -> Microsoft Edge voices (free, keyless)
#
# Set your Azure key in .env as:   AZURE_OPENAI_API_KEY=xxxxxxxx
default:
  logger:
    log_level: "INFO"
  service:
    host: "0.0.0.0"
    port: 8282
    cert_file: "ssl_certs/localhost.crt"
    cert_key: "ssl_certs/localhost.key"
  chat_engine:
    model_root: "models"
    concurrent_limit: 1  # FlashHead is VRAM-heavy; single session on a T4
    handler_search_path:
      - "src/handlers"
    handler_configs:
      RtcClient:
        module: client/rtc_client/client_handler_rtc
        connection_ttl: 900
      # Manual-interrupt handler (receives INTERRUPT and cancels the stream)
      InterruptHandler:
        module: logic/interrupt/interrupt_handler
      SileroVad:
        module: vad/silerovad/vad_handler_silero
        speaking_threshold: 0.5
        start_delay: 2048
        end_delay: 5000
        buffer_look_back: 5000
        speech_padding: 512
      # ASR: SenseVoice runs locally on the GPU and is multilingual (English OK)
      SenseVoice:
        enabled: True
        module: asr/sensevoice/asr_handler_sensevoice
        model_name: "iic/SenseVoiceSmall"
      # TTS: free Microsoft Edge voices (no API key). Pick any en-* voice, e.g.
      #   en-US-AriaNeural, en-US-JennyNeural, en-GB-SoniaNeural, en-AU-NatashaNeural
      Edge_TTS:
        enabled: True
        module: tts/edgetts/tts_handler_edgetts
        voice: "en-US-AriaNeural"
      # LLM: Azure OpenAI, OpenAI-compatible "v1" endpoint (no api-version needed).
      #   api_url  = https://<YOUR-RESOURCE>.openai.azure.com/openai/v1/
      #   model_name = your Azure *deployment name* (NOT the base model name)
      #   api_key  = read from env AZURE_OPENAI_API_KEY (see .env); leave commented below
      LLMOpenAICompatible:
        enabled: True
        module: llm/openai_compatible/llm_handler_openai_compatible
        model_name: "gpt-4o-mini"            # <-- your Azure DEPLOYMENT name
        api_url: "https://YOUR-RESOURCE.openai.azure.com/openai/v1/"   # <-- your Foundry/Azure OpenAI resource
        # api_key: "sk-..."                   # optional; default reads $AZURE_OPENAI_API_KEY
        enable_video_input: False
        history_length: 20
        system_prompt: "You are a friendly AI assistant. Reply in English with just two or three short spoken-style sentences. Use natural punctuation, and never talk about punctuation itself."
      # Avatar: SoulX-FlashHead (Lite mode) rendered on the GPU
      FlashHead:
        module: avatar/flashhead/avatar_handler_flashhead
        ckpt_dir: "models/SoulX-FlashHead-1_3B"
        wav2vec_dir: "models/wav2vec2-base-960h"
        model_type: "lite"
        cond_image_path: "resource/avatar/flashhead/girl.png"  # swap for your own portrait
        fps: 25
        base_seed: 42
        use_face_crop: false
        debug: false
        idle_noise_amplitude: 0.003
